# Alembic configuration for Inbox POS.
# The database URL is NOT stored here. migrations/env.py resolves it from DATABASE_URL (or DB_* variables)
# through app.db, exactly like the running application.
#
# Run from the fastapi/ directory:
#   alembic upgrade head                 # new, empty database
#   alembic stamp 0001_baseline          # existing database created before Alembic (run once, then upgrade)
#   (0002 inspects the live schema, so it cannot be previewed with --sql: rehearse on a staging copy)

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
