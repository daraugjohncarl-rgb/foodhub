<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard — Blessie FoodHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/assets/css/style.css?v=3">
</head>
<body>

<!-- Sidebar Overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <img src="/static/images/blessie.png" alt="Blessie FoodHub" class="sidebar-logo-img" onerror="this.style.display='none'">
        <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle Sidebar">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <nav>
        <div class="nav-section-title">Branch Operations</div>
        <ul class="nav-menu" id="sidebar-menu">
            <!-- Dynamic Navigation injected via permissions.js -->
        </ul>
    </nav>

    <div class="sidebar-bottom">
        <div class="nav-divider"></div>

        <!-- Sidebar User Card -->
        <div class="sidebar-user">
            <div class="avatar-fallback" id="sidebarAvatar" title="Manager">M</div>
            <div class="sidebar-user-info">
                <strong id="sidebarName">Shift Manager</strong>
                <span style="font-size:11px; color:#7b1fa2; font-weight:700;">MANAGER</span>
            </div>
        </div>

        <div style="padding: 0 16px 16px;">
            <a href="javascript:void(0)" class="logout-btn" id="logoutBtn" onclick="openLogoutModal()" data-title="Logout">
                <i class="fas fa-sign-out-alt"></i><span>Logout</span>
            </a>
        </div>
    </div>
</aside>

<!-- MAIN CONTENT -->
<div class="main-content" id="mainContent">

    <!-- TOP HEADER -->
    <header class="top-header">
        <div class="header-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
            <div class="header-title">
                <h1 id="current-page-title">Manager Dashboard</h1>
                <p id="liveDate">Loading…</p>
            </div>
        </div>
        <div class="header-actions">
            <div class="live-clock-badge" id="liveClock">00:00:00</div>

            <!-- Notification Bell -->
            <div style="position: relative;">
                <button class="notif-btn" id="notifBell" title="Branch Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge" id="notifBadge" style="display:none">0</span>
                </button>
                <div class="notif-dropdown" id="notifDropdown">
                    <div class="notif-header">
                        <h3>Notifications</h3>
                        <div class="notif-header-actions">
                            <span class="notif-action-link" id="markAllRead">Mark all read</span>
                            <span class="notif-action-link" id="clearNotifs" style="color: var(--danger);">Clear</span>
                        </div>
                    </div>
                    <div class="notif-list" id="notifList"></div>
                </div>
            </div>

            <!-- Avatar -->
            <div class="header-avatar">
                <div class="avatar-fallback" id="headerAvatar" onclick="openLogoutModal()" title="Logout">M</div>
            </div>
        </div>
    </header>

    <!-- PAGE VIEW CONTAINER (Single-Page Dynamic Router) -->
    <div class="page-wrapper" id="view-container" style="padding: 24px;"></div>
</div>

<!-- Modal Dialog Container -->
<div class="modal-overlay" id="modal-container" style="display:none;">
    <div class="modal" id="modal-content"></div>
</div>

<!-- Logout Confirmation Modal -->
<div class="modal-overlay" id="logoutModal" style="display:none;">
    <div class="modal modal-sm">
        <div class="modal-body" style="text-align:center; padding: 36px 28px;">
            <div class="confirm-icon warning"><i class="fas fa-sign-out-alt"></i></div>
            <h2 style="font-size:18px; margin-bottom:10px;">Confirm Logout</h2>
            <p style="color:var(--text-muted); font-size:14px;">Are you sure you want to end your Manager session?</p>
        </div>
        <div class="modal-footer" style="justify-content:center; gap:16px; padding-bottom:28px;">
            <button type="button" class="btn btn-outline" id="cancelLogout" onclick="closeLogoutModal()">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmLogout" onclick="doLogout()">Logout</button>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div id="toastContainer"></div>
<div id="toast-container"></div>
<div id="printable-receipt" style="display:none;"></div>

<!-- JS Modules -->
<script src="/static/js/storage.js"></script>
<script src="/static/assets/js/utils.js?v=2"></script>
<script src="/static/assets/js/auth.js"></script>
<script src="/static/assets/js/permissions.js"></script>
<script src="/static/assets/js/suppliers.js"></script>
<script src="/static/assets/js/purchase_orders.js"></script>
<script src="/static/assets/js/views.js"></script>
<script src="/static/assets/js/manager.js"></script>
</body>
</html>
