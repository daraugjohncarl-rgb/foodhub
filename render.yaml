services:
  # Web service for Inbox POS. The database is Supabase PostgreSQL (set DATABASE_URL in the
  # Render dashboard; it is intentionally not stored in this file).
  - type: web
    name: inbox-pos
    rootDir: fastapi
    runtime: python
    region: singapore # or oregon / frankfurt
    plan: free # use a paid plan for production to avoid cold starts
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/healthz"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase connection string, set manually in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720
      - key: ALLOWED_HOSTS
        sync: false # e.g. your-app.onrender.com,pos.example.com
      - key: TRUSTED_PROXY_COUNT
        value: 1 # Render's proxy appends the client IP to X-Forwarded-For; raise to 2 if you add Cloudflare in front
