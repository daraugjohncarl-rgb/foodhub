services:
  # Web Service for Inbox POS
  - type: web
    name: inbox-pos
    runtime: python
    region: singapore # or oregon / frankfurt
    plan: free
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/test-db"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: inbox-pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720

databases:
  # Managed PostgreSQL Database on Render
  - name: inbox-pos-db
    region: singapore
    plan: free
    databaseName: inbox_pos
    user: inbox_user
