erflow: hidden; }        .stat-info h3 { font-size: 11px; color: var(--text-muted, #71717a); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }        .stat-count { font-size: clamp(16px, 1.8vw, 22px); font-weight: 800; color: var(--text-main, #18181b); line-height: 1.1; white-space: nowrap; }        .stat-trend { font-size: 10px; margin-top: 2px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }        .section-card {            background: var(--card-bg, #ffffff);            border: 1px solid rgba(205, 190, 150, 0.35);            border-radius: var(--radius-card, 14px);            box-shadow: 0 4px 15px rgba(0,0,0,0.03);            overflow: hidden;            margin-bottom: 16px;            width: 100%;            max-width: 100%;            box-sizing: border-box;        }        .section-head {            padding: 12px 18px;            border-bottom: 1px solid rgba(205, 190, 150, 0.25);            display: flex;            justify-content: space-between;            align-items: center;            flex-wrap: wrap;            gap: 8px;        }        .section-head h2 { font-size: 14px; font-weight: 700; color: var(--text-main, #18181b); margin: 0; }        .table-wrap { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }        table { width: 100%; border-collapse: collapse; text-align: left; }        th { padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--text-muted, #71717a); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(205, 190, 150, 0.25); background: rgba(0, 0, 0, 0.01); white-space: nowrap; }        td { padding: 10px 14px; border-bottom: 1px solid rgba(205, 190, 150, 0.15); font-size: 12px; vertical-align: middle; }        tr:last-child td { border-bottom: none; }    </style></head><body><!-- Sidebar Overlay (mobile) --
