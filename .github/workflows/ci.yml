name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: inboxpos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fastapi/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r fastapi/requirements-dev.txt pglast
      - name: Install front-end test dependencies (jsdom)
        working-directory: fastapi/tests/js
        run: npm install --no-audit --no-fund
      - name: Run tests (SQLite for the API, disposable PostgreSQL service for the migrations)
        working-directory: fastapi
        env:
          TEST_POSTGRES_URL: postgresql://postgres:ci-only-password@localhost:5432/inboxpos_test
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r fastapi/requirements.txt
