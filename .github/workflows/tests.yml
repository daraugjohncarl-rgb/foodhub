name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: inbox_pos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database only; the suite refuses any database whose name does not end in "_test".
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/inbox_pos_test
    defaults:
      run:
        working-directory: fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fastapi/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/inbox_pos_test
          INBOX_POS_SKIP_DOTENV: "1"
        run: |
          alembic upgrade head
          alembic check
      - run: python -m pytest -q
      - name: JavaScript syntax
        run: for f in static/assets/js/*.js static/js/*.js; do node --check "$f"; done
